*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#ddd8e4;color:#181818}button,input,textarea{font:inherit}button{cursor:pointer}#phone{height:100dvh;max-width:430px;margin:auto;position:relative;overflow:hidden;background:#f7f7f8}.screen{position:absolute;inset:0;display:none;overflow:auto;background:#fff}.screen.active{display:block;animation:open .28s cubic-bezier(.2,.8,.2,1)}@keyframes open{from{opacity:.5;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}.wall{background:linear-gradient(145deg,#9c91c3 0%,#e3b9d5 45%,#b1d3e7 100%)}.status{height:53px;display:flex;justify-content:space-between;align-items:center;padding:12px 25px 0;font-size:15px;font-weight:650;position:relative;z-index:5}.island{width:95px;height:27px;border-radius:18px;background:#111;position:absolute;left:50%;transform:translateX(-50%);top:12px}.homebar{height:5px;width:120px;background:#161616;border-radius:10px;position:absolute;bottom:9px;left:50%;transform:translateX(-50%);z-index:10;cursor:pointer}.lightbar{background:#fff}.locktime{text-align:center;color:white;margin-top:65px;text-shadow:0 1px 5px #0002}.locktime .big{font-size:78px;font-weight:200;letter-spacing:-4px}.locktime .date{font-size:20px}.unlock{position:absolute;bottom:60px;width:100%;text-align:center;color:white}.pin{display:flex;justify-content:center;gap:12px;margin:15px}.dot{height:12px;width:12px;border:1px solid white;border-radius:50%}.dot.filled{background:white}.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:13px;justify-content:center}.key{width:68px;height:68px;border:0;border-radius:50%;background:#ffffff35;color:white;font-size:29px;backdrop-filter:blur(15px)}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 9px;padding:38px 18px}.appicon{border:0;background:none;color:white;text-shadow:0 1px 3px #0005;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px}.square{height:62px;width:62px;border-radius:15px;display:grid;place-items:center;font-size:29px;color:white;text-shadow:none;box-shadow:0 3px 8px #0002}.dock{position:absolute;bottom:28px;left:14px;right:14px;border-radius:25px;background:#ffffff55;display:flex;justify-content:space-around;padding:12px 4px;backdrop-filter:blur(18px)}.dock button{border:0;background:none}.dock .square{height:58px;width:58px}.nav{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;background:#fff}.nav b{font-size:19px}.nav button,.tabs button,.action{background:none;border:0;color:inherit}.blue{color:#1685e9}.muted{color:#81818a;font-size:13px}.avatar{width:43px;height:43px;border-radius:50%;background:#e9ddf8;display:grid;place-items:center;flex-shrink:0;font-size:24px}.post{display:flex;gap:10px;padding:13px;border-bottom:1px solid #eee}.postmain{flex:1;min-width:0}.post p{white-space:pre-wrap;margin:8px 0 14px;line-height:1.45;font-size:15px}.postactions{display:flex;justify-content:space-between;color:#666;font-size:13px}.postactions button{border:0;background:none;color:inherit}.tabs{display:flex;justify-content:space-around;border-top:1px solid #eee;position:absolute;bottom:15px;left:0;right:0;background:white;padding:13px}.tabs button{font-size:21px}.content{height:calc(100% - 125px);overflow:auto}.fab{position:absolute;bottom:85px;right:18px;background:#188de8;color:white;border:0;border-radius:50%;height:53px;width:53px;font-size:27px;box-shadow:0 3px 12px #0003}.row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #eee;cursor:pointer}.row .grow{flex:1}.chat{height:calc(100% - 170px);overflow:auto;padding:15px;background:#fff}.bubble{padding:11px 14px;border-radius:19px;max-width:78%;width:fit-content;margin:10px 0;background:#e9e9ec;white-space:pre-wrap}.bubble.me{margin-left:auto;background:#1685ef;color:white}.compose{display:flex;gap:7px;padding:10px;position:absolute;bottom:22px;left:0;right:0;background:white;border-top:1px solid #eee}.compose input,.compose textarea{flex:1;border:1px solid #ddd;border-radius:20px;padding:10px 13px;min-width:0}.compose button,.primary{border:0;border-radius:20px;background:#1685ef;color:white;padding:10px 16px}.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.igphoto{aspect-ratio:1;background:linear-gradient(130deg,#d7c0ed,#f8e4e7);display:grid;place-items:center;font-size:38px}.story{display:flex;gap:15px;padding:13px;overflow:auto}.story>div{text-align:center;font-size:11px}.story .avatar{border:2px solid #e34d91;width:62px;height:62px}.profilehead{padding:20px}.stats{display:flex;justify-content:space-around;margin:15px 0}.sheet{position:absolute;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end}.sheet.show{display:flex}.sheetbody{background:#fff;width:100%;padding:20px;border-radius:22px 22px 0 0;max-height:85%;overflow:auto}.sheet input,.sheet textarea,.sheet select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:7px 0}.sheet textarea{min-height:110px}.sheet .primary{width:100%;margin-top:12px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:25px 60px;text-align:center}.dial button{border:0;border-radius:50%;background:#eee;height:65px;font-size:26px}.call{background:linear-gradient(#6b758e,#222a39)!important;color:white;text-align:center}.call .round{border:0;border-radius:50%;width:65px;height:65px;font-size:24px;margin:10px}.search{width:calc(100% - 28px);margin:12px 14px;padding:11px;background:#f0f0f2;border:0;border-radius:12px}.back{color:#1685ef;font-size:16px}.notif{margin:20px;background:#ffffff77;padding:14px;border-radius:15px;color:#222;backdrop-filter:blur(10px)}.hidden{display:none!important}

<script>
const $=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),people=[{name:'소오',id:'soo_0108',face:'🌷'},{name:'우타',id:'uta_0205',face:'🎧'},{name:'테토',id:'teto',face:'🥖'},{name:'모모',id:'momo',face:'🍑'},{name:'레이',id:'rei',face:'🌙'}],person=n=>people.find(p=>p.name===n)||{name:n,id:n,face:'👤'};
const seed={posts:[{id:1,who:'테토',text:'오늘도 빵이 맛있다!! 🥖',likes:12},{id:2,who:'우타',text:'새 노래 연습 중. 소오는 잘 지내고 있으려나?',likes:24},{id:3,who:'소오',text:'오늘은 하늘이 예뻤어. 우타한테도 보여주고 싶어.',likes:8}],chats:{'우타':[{me:false,text:'소오, 오늘도 잘 지냈어?'},{me:true,text:'응! 오늘은 구름을 봤어.'}],'테토':[{me:false,text:'소오!! 바게트 먹으러 갈래?'}],'모모':[{me:false,text:'오늘 같이 노래할까?'}],'레이':[{me:false,text:'좋은 아침.'}]},ig:[{who:'모모',text:'오늘의 작은 행복 🍑',photo:'🌸'},{who:'우타',text:'연습실에서 🎵',photo:'🎹'}],photos:['🌸','🎹','☁️','🎧'],notes:['오늘은 우타에게 하고 싶은 말이 생겼어.'],calls:[]};
let data;try{data=JSON.parse(localStorage.getItem('utauPhoneData'))||seed}catch{data=seed}let current='소오',chatTarget='우타',pin='',active='lock',callTarget='';
const save=()=>localStorage.setItem('utauPhoneData',JSON.stringify(data));function showApp(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');active=id;$('bar').classList.toggle('lightbar',id==='lock'||id==='home'||id==='calling');if(id==='x')renderX();if(id==='instagram')renderIg();if(id==='messages')renderChats();if(id==='phoneapp')phoneRecent();if(id==='photos')renderPhotos();if(id==='notes')renderNotes()}
function clock(){const d=new Date(),t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});$('lclock').textContent=t;$('ltop').textContent=t;$('htime').textContent=t;$('ldate').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}clock();setInterval(clock,20000);
function dots(){$('dots').innerHTML=Array.from({length:4},(_,i)=>'<span class="dot '+(i<pin.length?'filled':'')+'"></span>').join('')};dots();$('keys').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':'<button class="key" onclick="keyPress(\''+n+'\')">'+n+'</button>').join('');function keyPress(n){pin=n==='⌫'?pin.slice(0,-1):pin+n;dots();if(pin.length===4){if(pin==='0205')showApp('home');else setTimeout(()=>alert('암호가 올바르지 않습니다'),80);pin='';setTimeout(dots,120)}}function lockPhone(){showApp('lock')}
const appList=[['𝕏','X','x','#101010'],['◎','Instagram','instagram','linear-gradient(35deg,#ffb33e,#e34291,#6b4bd8)'],['💬','메시지','messages','#3bcb65'],['☎','전화','phoneapp','#41c865'],['🌄','사진','photos','#fff'],['📝','메모','notes','#ffdf66'],['⚙','설정','settings','#8d8d92']];
function appButton(a){return '<button class="appicon" onclick="showApp(\''+a[2]+'\')"><span class="square" style="background:'+a[3]+'">'+a[0]+'</span>'+a[1]+'</button>'}$('apps').innerHTML=appList.map(appButton).join('');$('dock').innerHTML=[appList[3],appList[2],appList[0],appList[1]].map(a=>'<button onclick="showApp(\''+a[2]+'\')"><span class="square" style="background:'+a[3]+'">'+a[0]+'</span></button>').join('');
function sheet(title,body){$('sheetbody').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>'+title+'</b><button onclick="closeSheet()" style="border:0;background:none;font-size:22px">×</button></div>'+body;$('sheet').classList.add('show')}function closeSheet(){$('sheet').classList.remove('show')}
function accounts(){sheet('계정 전환',people.map(p=>'<div class="row" onclick="current=\''+p.name+'\';closeSheet();renderX()"><span class="avatar">'+p.face+'</span><div class="grow"><b>'+p.name+'</b><br><span class="muted">@'+p.id+'</span></div>'+(p.name===current?'✓':'')+'</div>').join(''))}
function renderX(){const posts=data.posts.map(p=>{let u=person(p.who);return '<article class="post"><span class="avatar" onclick="showXProfile(\''+u.name+'\')">'+u.face+'</span><div class="postmain"><div onclick="showXProfile(\''+u.name+'\')"><b>'+safe(u.name)+'</b> <span class="muted">@'+safe(u.id)+' · 최근</span></div><p>'+safe(p.text)+'</p><div class="postactions"><button onclick="replyPost('+p.id+')">♧ '+(p.replies?.length||0)+'</button><button onclick="repost('+p.id+')">⇄</button><button onclick="likePost('+p.id+')">'+(p.liked?'♥':'♡')+' '+p.likes+'</button><button onclick="sharePost('+p.id+')">⇧</button></div>'+(p.replies||[]).map(r=>'<p style="border-left:2px solid #ddd;padding-left:9px;font-size:13px"><b>'+safe(r.who)+'</b> '+safe(r.text)+'</p>').join('')+'</div></article>'}).join('');$('xbody').innerHTML='<div class="nav"><button onclick="renderX()">추천</button><button onclick="showXProfile(current)">팔로잉</button></div>'+posts}
function likePost(id){let p=data.posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();renderX()}function repost(id){let p=data.posts.find(x=>x.id===id);data.posts.unshift({id:Date.now(),who:current,text:'RT @'+person(p.who).id+': '+p.text,likes:0});save();renderX()}function sharePost(id){navigator.clipboard?.writeText(data.posts.find(p=>p.id===id).text);alert('게시글 내용을 복사했어!')}
function composePost(){sheet('새 게시물 · '+current,'<textarea id="posttext" placeholder="무슨 일이 일어나고 있나요?"></textarea><button class="primary" onclick="publishPost()">게시하기</button>')}function publishPost(){let t=$('posttext').value.trim();if(!t)return;data.posts.unshift({id:Date.now(),who:current,text:t,likes:0});save();closeSheet();renderX()}function replyPost(id){sheet('답글 작성','<textarea id="replytext" placeholder="답글을 작성하세요"></textarea><button class="primary" onclick="publishReply('+id+')">답글 게시</button>')}function publishReply(id){let t=$('replytext').value.trim();if(!t)return;let p=data.posts.find(x=>x.id===id);(p.replies??=[]).push({who:current,text:t});save();closeSheet();renderX()}function searchPosts(){sheet('게시물 검색','<input id="q" placeholder="검색어"><button class="primary" onclick="doSearch()">검색</button><div id="results"></div>')}function doSearch(){let q=$('q').value.toLowerCase();$('results').innerHTML=data.posts.filter(p=>(p.text+' '+p.who).toLowerCase().includes(q)).map(p=>'<div class="row"><b>'+safe(p.who)+'</b> '+safe(p.text)+'</div>').join('')||'검색 결과가 없어'}
function showXProfile(n){let p=person(n);$('xbody').innerHTML='<div style="height:115px;background:linear-gradient(100deg,#d2c2e9,#eac5d7)"></div><div class="profilehead"><div class="avatar" style="width:70px;height:70px;font-size:37px;margin-top:-50px;border:4px solid white">'+p.face+'</div><h2>'+safe(n)+'</h2><div class="muted">@'+p.id+'</div><p>오늘도 잘 부탁해.</p><span class="muted">팔로잉 24　 팔로워 108</span></div>'+data.posts.filter(x=>x.who===n).map(x=>'<div class="row">'+safe(x.text)+'</div>').join('');}
function renderIg(){$('igbody').innerHTML='<div class="story">'+people.map(p=>'<div onclick="igStory(\''+p.name+'\')"><span class="avatar">'+p.face+'</span>'+p.name+'</div>').join('')+'</div>'+data.ig.map((p,i)=>'<div style="border-top:1px solid #eee"><div class="row" onclick="igProfile(\''+p.who+'\')"><span class="avatar">'+person(p.who).face+'</span><b>'+safe(person(p.who).id)+'</b></div><div style="height:260px;background:linear-gradient(130deg,#e9d7f2,#f5dce5);display:grid;place-items:center;font-size:90px">'+safe(p.photo)+'</div><div style="padding:12px"><button class="action" onclick="igLike('+i+')">'+(p.liked?'♥':'♡')+'</button> <button class="action" onclick="igComment('+i+')">♧</button> <button class="action" onclick="showApp(\'messages\')">➤</button><p><b>'+safe(person(p.who).id)+'</b> '+safe(p.text)+'</p>'+(p.comments||[]).map(c=>'<div class="muted">'+safe(c)+'</div>').join('')+'</div></div>').join('')}
function igLike(i){data.ig[i].liked=!data.ig[i].liked;save();renderIg()}function igComment(i){sheet('댓글','<input id="comment" placeholder="댓글 추가"><button class="primary" onclick="postIgComment('+i+')">게시</button>')}function postIgComment(i){let t=$('comment').value.trim();if(!t)return;(data.ig[i].comments??=[]).push(current+': '+t);save();closeSheet();renderIg()}function newIg(){sheet('새 게시물','<input id="igemoji" placeholder="사진 대신 표시할 이모지 (예: 🌷)"><textarea id="igcaption" placeholder="문구 작성"></textarea><button class="primary" onclick="publishIg()">공유</button>')}function publishIg(){data.ig.unshift({who:current,text:$('igcaption').value,photo:$('igemoji').value||'🌷'});save();closeSheet();renderIg()}function igProfile(n=current){let p=person(n);$('igbody').innerHTML='<div class="profilehead"><h2>'+p.id+'</h2><div class="row"><span class="avatar" style="height:78px;width:78px;font-size:40px">'+p.face+'</span><div class="stats grow"><span><b>'+data.ig.filter(x=>x.who===n).length+'</b><br>게시물</span><span><b>123</b><br>팔로워</span><span><b>54</b><br>팔로잉</span></div></div><b>'+n+'</b><p>일상 기록 ♡</p><button class="primary" onclick="renderIg()">피드로</button></div><div class="iggrid">'+data.ig.filter(x=>x.who===n).map(x=>'<div class="igphoto">'+safe(x.photo)+'</div>').join('')+'</div>'}function igStory(n){sheet(n+'님의 스토리','<div style="height:280px;background:linear-gradient(#dac2ec,#e9c8d5);display:grid;place-items:center;font-size:90px">'+person(n).face+'</div>')}
function renderChats(filter=''){$('msgbody').innerHTML=Object.keys(data.chats).filter(n=>n.includes(filter)).map(n=>'<div class="row" onclick="openChat(\''+n+'\')"><span class="avatar">'+person(n).face+'</span><div class="grow"><b>'+safe(n)+'</b><div class="muted">'+safe(data.chats[n].at(-1)?.text||'')+'</div></div><span class="muted">›</span></div>').join('')}function filterChats(q){renderChats(q)}function openChat(n){chatTarget=n;$('chatname').textContent=n;showApp('chatview');$('chatbody').innerHTML=(data.chats[n]||[]).map(m=>'<div class="bubble '+(m.me?'me':'')+'">'+safe(m.text)+'</div>').join('');$('chatbody').scrollTop=$('chatbody').scrollHeight}function sendMsg(e){e.preventDefault();let t=$('msginput').value.trim();if(!t)return;(data.chats[chatTarget]??=[]).push({me:true,text:t});$('msginput').value='';save();openChat(chatTarget)}function newChat(){sheet('새 메시지','<select id="recipient">'+people.filter(p=>p.name!=='소오').map(p=>'<option>'+p.name+'</option>').join('')+'</select><button class="primary" onclick="closeSheet();openChat($(\'recipient\').value)">대화 시작</button>')}
function phoneRecent(){$('phonebody').innerHTML='<h2 style="padding:0 16px">최근 통화</h2>'+data.calls.map(c=>'<div class="row" onclick="startCall(\''+c.name+'\')"><span class="avatar">'+person(c.name).face+'</span><div class="grow"><b>'+safe(c.name)+'</b><div class="muted">'+safe(c.date)+'</div></div><span class="blue">ⓘ</span></div>').join('')+'<div class="row muted">통화 기록이 없으면 연락처에서 전화를 걸어봐.</div>'}function phoneContacts(){$('phonebody').innerHTML='<h2 style="padding:0 16px">연락처</h2>'+people.map(p=>'<div class="row" onclick="startCall(\''+p.name+'\')"><span class="avatar">'+p.face+'</span><div class="grow">'+p.name+'</div><span class="blue">☎</span></div>').join('')}let dialNumber='';function phoneDial(){$('phonebody').innerHTML='<h2 style="text-align:center">'+safe(dialNumber||'　')+'</h2><div class="dial">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>'<button onclick="dialNumber+=\''+n+'\';phoneDial()">'+n+'</button>').join('')+'</div><div style="text-align:center"><button class="primary" onclick="startCall(\'알 수 없음\')">☎ 통화</button><button class="action" onclick="dialNumber=dialNumber.slice(0,-1);phoneDial()">⌫</button></div>'}function newContact(){sheet('연락처','<p>기본 캐릭터 연락처가 등록되어 있어.</p>')}
function startCall(n){callTarget=n;$('callname').textContent=n;$('callstate').textContent='연결 중...';data.calls.unshift({name:n,date:new Date().toLocaleString('ko-KR')});save();showApp('calling')}function endCall(){showApp('phoneapp')}
function renderPhotos(){$('photobody').innerHTML=data.photos.map(p=>'<div class="igphoto">'+safe(p)+'</div>').join('')}function addPhoto(){sheet('사진 추가','<input id="photoemoji" placeholder="사진 대신 이모지"><button class="primary" onclick="data.photos.unshift($(\'photoemoji\').value||\'🌸\');save();closeSheet();renderPhotos()">추가</button>')}function renderNotes(){$('notebody').innerHTML=data.notes.map((n,i)=>'<div class="row" onclick="editNote('+i+')">📝 <div class="grow">'+safe(n.slice(0,65))+'</div>›</div>').join('')}function editNote(i=-1){sheet('메모','<textarea id="notetext">'+safe(i>=0?data.notes[i]:'')+'</textarea><button class="primary" onclick="saveNote('+i+')">저장</button>')}function saveNote(i){let t=$('notetext').value;if(i<0)data.notes.unshift(t);else data.notes[i]=t;save();closeSheet();renderNotes()}
</script></body></html>
